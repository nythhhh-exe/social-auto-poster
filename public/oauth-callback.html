<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Authorization - NexusPost</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090a0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-size: 15px; font-weight: 600;">Authenticating with NexusPost...</p>
  <p style="font-size: 13px; color: #94a3b8;">This window will close automatically.</p>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error_message') || urlParams.get('error');

      if (window.opener) {
        window.opener.postMessage({
          type: 'FB_AUTH_RESPONSE',
          code: code,
          error: error
        }, '*');
        setTimeout(() => window.close(), 600);
      } else {
        // Fallback for non-popup redirection
        if (code) {
          window.location.href = '/accounts?fb_code=' + encodeURIComponent(code);
        } else {
          window.location.href = '/accounts?fb_error=' + encodeURIComponent(error || 'Unknown error');
        }
      }
    })();
  </script>
</body>
</html>
